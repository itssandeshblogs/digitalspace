<style id="app-css">
/* Layout: sticky white header, highlights ticker, hero + latest rail, category strip, full-bleed dark video band, topics grid with rail, video carousel, dark footer. */
:root{
  --bg:#ffffff; --bg-soft:#f4eedd; --bg-band:#ebe3cf; --ink:#000000; --ink-2:#3b3b3b; --line:#e4dcc6;
  --navy:#0f3a6d; --navy-ink:#ffffff; --link:#0f3a6d; --red:#ff3b30; --red-deep:#d92d23;
  --card:#fffdf6; --shadow:0 2px 16px rgba(60,45,10,.10); --field:#fffdf6;
  --dark:#0e1322; --dark-2:#1a2133; --foot:#212327; --foot-chip:#393b41;
  --font-ui:'Inter','Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-np:'Newsreader','Mukta',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-np);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
h1,h2,h3{text-wrap:balance;line-height:1.4;margin:0}
.wrap{max-width:1192px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg{display:block}
.ic{width:1em;height:1em;fill:currentColor}
.ic-s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);box-shadow:var(--shadow)}
.hdr .wrap{display:flex;align-items:center;gap:34px;height:80px}
.burger{background:none;border:0;padding:8px;display:flex;flex-direction:column;gap:6px;width:46px}
.burger i{display:block;height:2.5px;background:var(--ink);border-radius:2px}
.burger i:nth-child(1){width:30px}.burger i:nth-child(2){width:22px}.burger i:nth-child(3){width:30px}
.logo{display:flex;align-items:center;gap:12px;color:var(--ink)}
.logo-mark{width:48px;height:48px;border:1.8px solid currentColor;border-radius:50%;display:grid;place-items:center;font-family:var(--font-ui);font-style:italic;font-weight:300;font-size:26px;line-height:1}
.logo-img{height:48px;width:auto;max-width:180px;object-fit:contain}
.logo-rule{width:1.5px;height:44px;background:currentColor;opacity:.8}
.logo-t{font-family:var(--font-ui);display:flex;flex-direction:column;line-height:1.15}
.logo-t b{font-weight:400;font-size:22px;letter-spacing:.2em}
.logo-t small{font-weight:300;font-size:10px;letter-spacing:.24em;margin-top:2px}
.nav{display:flex;gap:30px;font-family:var(--font-ui);font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.nav a{padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{border-color:var(--red)}
.hsoc{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:16px}
.hsoc a,.hsoc button{background:none;border:0;padding:4px;display:grid;place-items:center}
.hsoc a:hover,.hsoc button:hover{color:var(--red)}

/* drawer + overlays */
.drawer{position:fixed;inset:0;z-index:80;display:flex}
.drawer-bg{position:absolute;inset:0;background:rgba(5,8,16,.55)}
.drawer-p{position:relative;width:min(320px,86vw);background:var(--bg);height:100%;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 24px 24px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.drawer-p h4{margin:18px 0 4px;font:600 11px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.drawer-p a{padding:9px 0;font-size:17px;font-weight:500;border-bottom:1px solid var(--line)}
.drawer-p a:hover{color:var(--red)}
.xbtn{align-self:flex-end;background:none;border:0;font-size:26px;line-height:1;padding:4px 8px}
.search{position:fixed;inset:0;z-index:85;background:rgba(5,8,16,.72);padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.search-box{max-width:720px;margin:0 auto;background:var(--bg);border-radius:10px;padding:18px;max-height:100%;overflow:auto}
.search-box input{width:100%;border:0;border-bottom:2px solid var(--navy);background:transparent;font:500 20px var(--font-np);color:var(--ink);padding:8px 2px;outline:none}
.sres{display:flex;flex-direction:column;margin-top:10px}
.sres a{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.sres img,.sres .ph{width:72px;height:48px;border-radius:4px;object-fit:cover;flex:none}
.sres small{color:var(--link);font-weight:700}
.empty{padding:18px 4px;color:var(--ink-2)}

/* shared pieces */
.badge{display:inline-block;background:var(--navy);color:var(--navy-ink);font-weight:700;font-size:13px;line-height:1.3;padding:4px 11px;border-radius:4px}
.yt-ic{position:absolute;top:9px;right:10px;width:30px;height:21px;color:var(--red);filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.yt-ic svg{width:100%;height:100%}
.ph{background:linear-gradient(135deg,#1c3556,#0d1b30 70%);display:grid;place-items:center;color:rgba(255,255,255,.55);font:700 44px var(--font-np);object-fit:cover}
.pencil{position:absolute;top:9px;right:9px;z-index:3;width:32px;height:32px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:15px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.rel{position:relative}
.sec-h{display:flex;align-items:center;gap:16px;margin:0 0 20px}
.sec-h h2{font-size:21px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line);order:2}
.sec-h .circ{order:1;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow);font-size:13px}
.hl{display:flex;border:1px solid var(--line);background:var(--bg-soft);border-radius:8px;overflow:hidden;align-items:stretch}
.hl b{background:var(--navy);color:var(--navy-ink);font:700 13px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:11px 18px;display:flex;align-items:center;white-space:nowrap}
.hl span{padding:9px 16px;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* home: hero + rail */
.top{display:grid;grid-template-columns:minmax(0,1fr) 376px;gap:30px;margin-top:64px}
.hero{border-radius:8px;overflow:hidden;background:#0d1b30}
.hero>a{display:block;position:relative;aspect-ratio:16/9;color:#fff}
.hero img,.hero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0,rgba(0,0,0,.45) 38%,rgba(0,0,0,0) 62%)}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 28px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.hero h1{font-size:clamp(19px,2.3vw,26px);font-weight:700;line-height:1.5}
.rail h3{font-size:20px;font-weight:600}
.rail .sec-h{margin-bottom:18px}
.ritem{display:flex;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ritem:last-child{border:0}
.rthumb{display:block;width:120px;flex:none;background:var(--bg-band);border-radius:6px;overflow:hidden;padding-bottom:20px}
.rthumb img,.rthumb .ph{width:120px;height:59px;object-fit:cover;font-size:20px}
.ritem h4{margin:0;font-size:15px;font-weight:500;line-height:1.55}
.ritem small{display:block;margin-top:8px;color:var(--link);font-weight:700;font-size:13px}
.ritem a:hover h4{color:var(--red)}

/* category strip */
.strip{margin-top:54px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.rcard{border-radius:8px;overflow:hidden;background:var(--bg-soft)}
.rcard .im{position:relative;display:block;aspect-ratio:2/1;background:#0d1b30}
.rcard .im img,.rcard .im .ph{width:100%;height:100%;object-fit:cover}
.rcard .badge{position:absolute;top:12px;left:12px;font-size:13px}
.rcard .band{height:22px;background:var(--bg-band)}
.rcard h3{padding:16px 20px 18px;font-size:15px;font-weight:500;line-height:1.6;min-height:4.8em}
.rcard a:hover h3{color:var(--red)}

/* dark video band */
.vband{background:var(--dark);color:#fff;margin-top:54px;padding:44px 0 52px}
.vband .sec-h h2{font-size:22px}
.vband .sec-h::after{background:rgba(255,255,255,.14)}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 334px;gap:25px}
.player{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#05070d;cursor:pointer;width:100%;border:0;padding:0;text-align:left;color:#fff}
.player img,.player .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0) 45%)}
.player .ytb{position:absolute;top:34px;right:46px;width:54px;height:38px;color:var(--red);filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.player .pcap{position:absolute;left:20px;right:20px;bottom:18px;display:flex;align-items:center;gap:14px;font-size:18px;font-weight:500}
.sqplay{width:46px;height:46px;flex:none;background:var(--red);border-radius:6px;display:grid;place-items:center;font-size:18px}
.vlist{display:flex;flex-direction:column;gap:14px}
.vitem{display:flex;gap:14px;align-items:flex-start;background:none;border:0;padding:0;text-align:left;color:#fff;width:100%}
.vitem img,.vitem .ph{width:130px;height:80px;flex:none;border-radius:4px;object-fit:cover;font-size:24px}
.vitem span{font-size:14.5px;line-height:1.5;display:block}
.vitem em{display:block;color:var(--red);font-size:11px;margin-top:6px;font-style:normal}
.vitem:hover span{color:#ffb4ae}
.vitem.on{outline:2px solid var(--red);outline-offset:4px;border-radius:2px}

/* topics */
.topics{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:50px;margin-top:54px}
.tabs{display:flex;gap:6px;order:3;flex-wrap:wrap}
.tab{background:none;border:0;border-radius:4px;padding:6px 16px;font-size:15.5px;font-weight:500}
.tab.on{background:var(--navy);color:var(--navy-ink);font-weight:700}
.tab:not(.on):hover{color:var(--red)}
.tcard{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.tcard .im{position:relative;display:block;aspect-ratio:16/9;background:#0d1b30}
.tcard .im img,.tcard .im .ph{width:100%;height:100%;object-fit:cover}
.tcard .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.tcard small{font-size:13px;font-weight:700;color:var(--link)}
.tcard h3{font-size:14.5px;font-weight:500;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard a:hover h3{color:var(--red)}
.more{display:flex;justify-content:flex-end;margin-top:22px}
.pill{background:var(--bg-soft);border:0;border-radius:99px;padding:8px 24px;font:700 14px var(--font-ui);color:var(--red)}
.pill:hover{background:var(--bg-band)}
.hl2{margin-top:30px}

/* gallery */
.gal{margin:58px auto 64px}
.car{position:relative}
.track{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 14px}
.track::-webkit-scrollbar{display:none}
.gcard{position:relative;flex:0 0 min(370px,82%);aspect-ratio:16/9;border-radius:12px;overflow:hidden;scroll-snap-align:start;background:#05070d;color:#fff;box-shadow:var(--shadow)}
.gcard>a{position:absolute;inset:0;display:block}
.gcard img,.gcard .ph{width:100%;height:100%;object-fit:cover}
.gcard .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,0) 50%)}
.gcard .badge{position:absolute;top:10px;left:10px;background:var(--red);font-size:12px;padding:3px 9px}
.gcard .bigplay{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(214,34,24,.92);display:grid;place-items:center;font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.gcard .gt{position:absolute;left:12px;right:12px;bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:600;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.arr{position:absolute;top:calc(50% - 20px);width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;box-shadow:0 2px 12px rgba(0,0,0,.28);display:grid;place-items:center;z-index:4}
.arr.l{left:-12px}.arr.r{right:-12px}
.arr:hover{color:var(--red)}

/* footer */
.foot{background:var(--foot);color:#fff;padding:42px 0 54px;text-align:center}
.fsoc{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.fsoc a{width:40px;height:40px;border-radius:50%;background:var(--foot-chip);display:grid;place-items:center;font-size:17px}
.fsoc a:hover{background:var(--red)}
.flinks{margin-top:22px;display:flex;justify-content:center;gap:18px;font:700 14px var(--font-ui);color:#aeb3bd}
.flinks a:hover{color:#fff}
.fnote{margin-top:14px;font-size:13px;color:#8e949f}
.totop{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:6px;border:0;background:var(--red);color:#fff;font-size:20px;display:grid;place-items:center;z-index:40;box-shadow:0 3px 12px rgba(0,0,0,.3)}

/* post / pages */
.post{max-width:780px;margin:0 auto;padding:44px 0 70px}
/* single post: left-aligned layout, Setopati-style hero */
.pv{--hh:80px}
.on-post .hdr{display:none}
.phero{position:relative;width:100%;height:clamp(380px,80vh,660px);background:linear-gradient(135deg,#1c3556,#0d1b30 70%);overflow:hidden;color:#fff}
.phero.short{height:clamp(260px,42vh,380px)}
.phero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phero .dim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.35),rgba(0,0,0,.12))}
.phero .ptxt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-left,0px))}
.phero .pbox{max-width:760px;width:100%;background:rgba(0,0,0,.5);padding:30px 38px 34px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.phero .badge{margin:0;background:var(--red);font-family:var(--font-np)}
.phero h1{font-family:'Mukta','Newsreader',sans-serif;color:#fff;font-weight:700;font-size:clamp(28px,4.6vw,52px);line-height:1.38;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.phero .wash{position:absolute;inset:0;background:#fff;opacity:var(--wash,0);pointer-events:none;will-change:opacity}
.ptbar{position:sticky;top:env(safe-area-inset-top,0px);height:0;z-index:40}
.ptbar-in{position:absolute;left:0;right:0;top:0;height:52px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-between;opacity:0;transform:translateY(-100%);pointer-events:none;transition:opacity .35s ease,transform .35s ease;padding:0}
.ptbar.show .ptbar-in{opacity:1;transform:none;pointer-events:auto}
.ptbar-in span{text-align:right}
.ptbar-in span{font-family:'Mukta','Newsreader',sans-serif;font-weight:500;font-size:18px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pv .post.sp{max-width:none;margin:0;padding:38px 0 70px;text-align:left}
.pv .post.sp>*{max-width:860px}
.pauthor{display:flex;align-items:center;gap:20px;padding-bottom:26px;margin-bottom:30px;border-bottom:1px solid var(--line);max-width:none!important}
.pauthor .av{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;background:var(--bg-band);display:grid;place-items:center;font:700 26px var(--font-np);color:var(--navy)}

REQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERB//Z","ogSiteName":"Sandesh Bhattarai","locale":"ne_NP","twitterHandle":"_iamsandesh","twitterCard":"summary_large_image","themeColor":"#0f3a6d","googleVerify":"","bingVerify":"","noindex":false},"categories":[{"id":"smaran","name":"स्मरण"},{"id":"samikshya","name":"समिक्षा"},{"id":"video","name":"भिडियो"}],"posts":[{"id":"smaran-1","title":"यात्राका पाइला, हिमालका छायाँ : घोरेपानीदेखि बन्दीपुरसम्मको स्मरणीय पानाहरू","category":"smaran","type":"article","date":"2026-10-10","cover":"/img/a-memorable-trip-from-ghorepani-to-bandipur-cover.jpg","video":"","excerpt":"घोरेपानीको उकालो, पुनहिलको सूर्योदय, पोखराको सिरसिर हावा र बन्दीपुरको शान्त वातावरण— यी सबै मिलेर मेरो जीवनको एउटा सुन्दर संस्मरण बनेका छन् ।","featured":true,"yt":false,"blocks":[{"t":"p","text":"बुटवल — समयको गतिसँगै धेरै कुराहरू बिर्सिँदै जान्छन्, तर केही यात्राहरू हृदयको यस्तो कुनामा कोरिएका हुन्छन् जसलाई उमेर र समयले पनि मेट्न सक्दैन। मेरो मानसपटलमा अझै ताजै छ — घोरेपानी, पुनहिल, पोखरा र बन्दीपुरको त्यो सुन्दर यात्रा। यात्रा मात्र एउटा ठाउँबाट अर्को ठाउँमा पुग्नु होइन रहेछ, यो त आफूभित्रका गुम्सिएका भावनाहरूलाई प्रकृतिसँग साट्ने एउटा सुन्दर बहाना रहेछ ।\n\n१. घान्द्रुक र घोरेपानीको उकालो : \nगुराँसे जंगल र पहाडी बाटो यात्राको सुरुवात पोखराबाट घान्द्रुक हुँदै घोरेपानीतर्फ सोझिएको थियो। बाटोभरि गुराँसका रुखहरूले स्वागत गरिरहेका थिए । ढुङ्गाले छापिएका पहाडी सिँढीहरू चढ्दा पाइलाहरू थाके पनि, चीसो हावाको स्पर्श र लोकल चियाको बास्नाले थकानलाई क्षणभरमै भुल्याइदिन्थ्यो। घोरेपानी पुग्दा साँझ परिसकेको थियो। काठका पुराना होटलहरू, चुलोवरिपरि बसेर गफिने पर्यटकहरू र पहाडी आतिथ्यले मनै लोभ्यायो।\n\n२. पुनहिलको बिहानी : \nअन्नपूर्णको काखमा सुनौलो बिहानी रातको अन्धकार नसकिँदै बिहानै ४ बजे पुनहिल (३,२१० मिटर) तर्फको उकालो सुरु भयो। चिसो हावा र टर्चको उज्यालोका भरमा अघि बढ्दाको अनुभव छुट्टै थियो। जब पुनहिलको डाँडामा पुगियो, पूर्वबाट सूर्यको पहिलो किरण अन्नपूर्ण र धौलागिरि हिमश्रृंखलामा ठोक्कियो। सेतो हिमाल क्षणभरमै सुनौलो रंगमा परिणत भएको त्यो दृश्य शब्दमा वर्णन गर्न असम्भव छ। आँखाअगाडि धौलागिरि, अन्नपूर्ण, माछापुच्छ्रे र निलगिरि टल्किएका थिए। त्यो पल समय रोकिएझैँ भयो, र मनमा एउटा अलौकिक शान्ति छायो ।"},{"t":"quote","text":"ढुङ्गाले छापिएका पहाडी सिँढीहरू चढ्दा पाइलाहरू थाके पनि, चीसो हावाको स्पर्श र लोकल चियाको बास्नाले थकानलाई क्षणभरमै भुल्याइदिन्थ्यो। घोरेपानी पुग्दा साँझ परिसकेको थियो। काठका पुराना होटलहरू, चुलोवरिपरि बसेर गफिने पर्यटकहरू र पहाडी आतिथ्यले मनै लोभ्यायो ।","cite":""},{"t":"p","text":"३. पोखराको फेवा र शान्ति :\nप्रकृतिको काखमा सुस्ताउँदा पुनहिलको कडा पैदलयात्रापछि पोखराको बसाइ विश्राम जस्तै थियो। फेवातालको किनारमा बसेर माछापुच्छ्रेको छायाँ पानीमा देख्दा लाग्थ्यो, प्रकृतिले पनि कति कलात्मक चित्र कोरेकी होली ! डुङ्गामा सवार भएर तालबाराहीको दर्शन गर्नु, राति लेकसाइडको सडकमा गुञ्जने संगीतमा रमाउनु र सराङकोटबाट पोखरा उपत्यका नियाल्नुका आफ्नै मिठास थिए । पोखराले सधैँ खुला हातले स्वागत गर्छ र फर्कने बेला एउटा मीठो तृष्णा छोडिदिन्छ ।\n\n४. बन्दीपुरको पहाडी गल्ली :\nविगत र वर्तमानको संगम यात्राको अन्तिम विन्दु थियो — तनहुँको ऐतिहासिक एवं सांस्कृतिक सहर बन्दीपुर । पोखराको आधुनिकताबाट सिधै बन्दीपुर पुग्दा समयको चक्र पछाडि घुमेझैँ महसुस हुन्छ। काठका बुट्टा भरिएका झ्यालहरू, नेवारी शैलीका घरहरू र मोटरगाडी नचल्ने ढुङ्गाका सफा गल्लीहरूले प्राचीन संस्कृति जोगाइराखेका छन्। साँझपख बन्दीपुरको टुँडिखेलबाट मर्स्याङ्दी उपत्यका नियाल्दा र डाँडामा बलेका बत्तीहरू हेर्दा यो यात्राको अन्त्य निकै सुखद भएको महसुस भयो ।\n\nअन्त्यमा\nघोरेपानीको उकालो, पुनहिलको सूर्योदय, पोखराको सिरसिर हावा र बन्दीपुरको शान्त वातावरण— यी सबै मिलेर मेरो जीवनको एउटा सुन्दर संस्मरण बनेका छन्। जब-जब सहरको धपेडीले मन थकित हुन्छ, म आँखा चिम्लेर फेरि तिनै हिमाल र पहाडी गल्लीहरूमा पुग्छु। यो यात्रा केवल एउटा घुमघाम थिएन, यो त आत्मालाई ताजा बनाउने एउटा अद्भूत अनुभूति थियो ।"}],"slug":"a-memorable-trip-from-ghorepani-to-bandipur","tags":["स्मरण","यात्रा","घोरेपानी","पुनहिल","बन्दीपुर"],"seoTitle":"यात्राका पाइला, हिमालका छायाँ : घोरेपानीदेखि बन्दीपुरसम्मको स्मरणीय पानाहरू","ogTitle":"यात्राका पाइला, हिमालका छायाँ : घोरेपानीदेखि बन्दीपुरसम्मको स्मरणीय पानाहरू","seoDesc":"घोरेपानीको उकालो, पुनहिलको सूर्योदय, पोखराको सिरसिर हावा र बन्दीपुरको शान्त वातावरण— यी सबै मिलेर मेरो जीवनको एउटा सुन्दर संस्मरण बनेका छन् ।","ogDesc":"घोरेपानीको उकालो, पुनहिलको सूर्योदय, पोखराको सिरसिर हावा र बन्दीपुरको शान्त वातावरण— यी सबै मिलेर मेरो जीवनको एउटा सुन्दर संस्मरण बनेका छन् ।"},{"id":"smaran-2","title":"अर्घाखाँचीको काखमा : नरपानीको अविस्मरणीय स्मरण","category":"smaran","type":"article","date":"2026-11-05","cover":"/img/one-night-stay-at-narpani-became-lifetime-memories-cover.jpg","video":"","excerpt":"छातीभित्र सजाएर फर्किएको त्यो एक रातको बसाई मेरो जीवनको एक अविस्मरणीय पाना बनेर सधैँ रहिरहनेछ ।","featured":false,"yt":false,"blocks":[{"t":"p","text":"बुटवल — डाँडाको काँधैकाँध भएर नागबेली परेर जेलिएको कच्ची-पक्की सडक, एकातिर अग्ला हरियाली पहाड त अर्कोतिर बादलको घुम्टोभित्र लुकामारी खेलिरहेका मनोरम उपत्यकाहरू । अर्घाखाँचीको ऐतिहासिक, सांस्कृतिक तथा प्राकृतिक गहना 'नरपानी' तर्फको त्यो यात्रा मेरो मानसपटलमा अझै पनि ताजै छ, मानौँ हिजोमात्रै घटेको कुनै सुन्दर सपना हो । सहरी भागदौड, कोलाहल र व्यस्त जीवनशैलीबाट केही समय खोसेर प्रकृतिसँग एकाकार हुनुको तृष्णाले हामीलाई नरपानीतर्फ डोर्याएको थियो।\n\nयात्राको थकानलाई बिस्तारै छाड्दै साँझपख जब नरपानी बजार पुग्यौँ, तब चिसो सिरटोले अनुहार स्पर्श गरेर आत्मीय स्वागत गर्यो। पहाडको अग्लो थुम्कामा अवस्थित नरपानीको मौसम आफैँमा एउटा जादू जस्तै लाग्यो — पलभरमै परिवर्तन भइरहने! कहिले कलिलो घामको झुल्का डाँडामा मुस्कुराउँथ्यो त कहिले क्षणभरमै बाक्लो हुस्सुले सिङ्गो डाँडै ढाकेर रहस्यमयी बनाइदिन्थ्यो । बसाई र स्थानीय आतिथ्यता नरपानीको त्यो एक रातको बसाई सम्झिँदा त्यहाँका सोझा, मिहिनेती मानिसहरू र उनीहरूको न्यानो आतिथ्यताको सम्झना अझ गाढा भएर आउँछ। "},{"t":"quote","text":"पूर्वको क्षितिजबाट बिस्तारै झुल्किएको कलिलो सूर्यको किरणले डाँडाकाँडालाई सुनौलो रङ्गमा पोखिदियो ।","cite":""},{"t":"p","text":"स्थानीय होमस्टे तथा होटेलमा पाइने अर्गानिक परिकार— तातो ढिँडो, लोकल खसी र कुखुराको मासु, गुन्द्रुक-भटमासको झोल र आफैँले टिपेर पकाइएको स्थानीय सागको स्वादले यात्राको आनन्दलाई दोब्बर बनाइदियो । रात बिस्तारै छिप्पिँदै जाँदा मौसम अझ चिसिँदै गयो। हामी डाँडाको डिलमा उभिएर तल्लो भागतिर हेर्थ्यौँ— रूपन्देही र कपिलवस्तुका विशाल फाँटहरूमा बलेका हजारौँ बत्तीहरू यसरी चम्किरहेका थिए, मानौँ धर्तीमै आकाशका ताराहरू ओर्लिएर दीपावली मनाइरहेका छन्। साँझको सिरटोमा आगोको राप ताप्दै स्थानीय वृद्धवृद्धाहरूसँग सुनिएका नरपानीका पुराना लोककथा, सुपा देउरालीसँग जोडिएका धार्मिक प्रसङ्गहरू र पहाडी जीवनका भोगाइहरूले मनलाई अर्कै दुनियाँमा पुर्याइदिए ।\n\nबिहानीको प्रभात र नरपानीको नबोलेको सौन्दर्य भोलिपल्ट बिहानै शीतल हावा र चराहरूको चिरबिर गुञ्जनसँगै आँखा खुले । बिहानीको सूर्योदय हेर्नका लागि हामी हतार-हतार नरपानीको 'भ्यु प्वाइन्ट' तर्फ लाग्यौँ। पूर्वको क्षितिजबाट बिस्तारै झुल्किएको कलिलो सूर्यको किरणले डाँडाकाँडालाई सुनौलो रङ्गमा पोखिदियो। उत्तरतर्फ फर्कँदा चाँदी जस्तै टल्केका हिमश्रृंखलाहरू मुस्कुराइरहेका थिए भने तल उपत्यकामा कुहिरोको विशाल सागर तैरिरहेको थियो। मानौँ हामी कुनै काल्पनिक स्वर्गको छेउमा उभिएका छौँ । प्रकृतिको त्यो अद्भुत क्यानभास, जहाँ शान्ति र सुन्दरता एकाकार भएका थिए, त्यसलाई शब्दमा उतार्न असम्भव जस्तै लाग्छ ।"},{"t":"p","text":"नरपानी केवल एउटा पर्यटकीय गन्तव्य मात्र होइन रहेछ; यो त थकित आत्मालाई पुनर्जीवन दिने, प्राकृतिक सुन्दरता र पहाडी जीवनशैलीको सुन्दर सङ्गम रहेछ। बाक्लो हुस्सु, सिरसिरे हावा, चिसो मौसम र आत्मीय मानिसहरूको न्यानो सम्झना छातीभित्र सजाएर फर्किएको त्यो एक रातको बसाई मेरो जीवनको एक अविस्मरणीय पाना बनेर सधैँ रहिरहनेछ ।"}],"slug":"one-night-stay-at-narpani-became-lifetime-memories","tags":["स्मरण","यात्रा","अर्घाखाँची","नरपानी"],"seoTitle":"अर्घाखाँचीको काखमा : नरपानीको अविस्मरणीय स्मरण","seoDesc":"डाँडाको काँधैकाँध भएर नागबेली परेर जेलिएको कच्ची-पक्की सडक, एकातिर अग्ला हरियाली पहाड त अर्कोतिर बादलको घुम्टोभित्र लुकामारी खेलिरहेका मनोरम उपत्यकाहरू ।","ogTitle":"अर्घाखाँचीको काखमा : नरपानीको अविस्मरणीय स्मरण","ogDesc":"डाँडाको काँधैकाँध भएर नागबेली परेर जेलिएको कच्ची-पक्की सडक, एकातिर अग्ला हरियाली पहाड त अर्कोतिर बादलको घुम्टोभित्र लुकामारी खेलिरहेका मनोरम उपत्यकाहरू ।"},{"id":"smaran-3","title":"शान्त राप्ती र घामको बिदाइ : चितवन यात्राका पानाहरू","category":"smaran","type":"article","date":"2026-11-04","cover":"/img/peaceful-rapti-and-sunset-a-chitwan-trip-remain-a-lifetime-memories-cover.jpg","video":"","excerpt":"छोटो समयको यो \"दुई दिन एक रात\" को बसाइले मनलाई नयाँ ऊर्जा र ताजगी मात्र दिएन, प्रकृतिको नजिक रहेर जीवनलाई नियाल्ने एउटा सुन्दर दृष्टिकोण पनि दियो।","featured":false,"yt":false,"blocks":[{"t":"p","text":"बुटवल — हरियो वन, शान्त वातावरण र तराईको न्यानो स्पर्श, चितवनको त्यो दुई दिन र एक रातको बसाइ मेरो मानसपटलमा अझै पनि ताजै छ। शहरको धपेडी, गाडीको हर्न र व्यस्त जीवनशैलीबाट केही समयका लागि अलग्गिएर प्रकृतिको काखमा सुस्ताउनुको मजा नै बेग्लै हुने रहेछ । नेपालकै पहिलो राष्ट्रिय निकुञ्ज रहेको चितवनतर्फको यात्रा शुरू हुँदा मनमा एउटा अलग्गै उत्साह थियो । नागबेली सडक र त्रिशूली नदीको किनारै-किनार अघि बढेको गाडी जब तराईको समथर भूभागमा छिर्यो, हावाको स्पर्श नै फेरियो। सौराहा पुग्दा दिउँसोको करिब दुई बजिसकेको थियो ।\n\nपहिलो दिन: राप्तीको सूर्यास्त र थारू संस्कृतिको रौनकता\nहोटलमा केही बेर आराम गरेपछि हामी राप्ती नदीको किनारतर्फ लाग्यौँ। साँझपख राप्ती नदीको किनारमा बसेर सूर्यास्त हेर्नुको अनुभव शब्दमा वर्णन गर्न गाह्रो छ। रातो-पहेंलो घाम बिस्तारै नदीको पानीमा बिलाउँदै गर्दा देखिएको दृश्य कुनै जीवन्त क्यान्भासभन्दा कम थिएन। नदीको अर्को किनारमा कहिलेकाहीँ गोही घाम तापिरहेको देखिन्थ्यो भने चराहरूको टोली आफ्नो बासस्थानतर्फ फर्किरहेका थिए ।\nसाँझ परेपछि हामी थारू सांस्कृतिक भवनतर्फ लाग्यौँ। त्यहाँ प्रस्तुत गरिएको थारू समुदायको परम्परागत मयूर नाच र विशेष गरी 'लाठी नाच' ले वातावरण नै गुञ्जायमान बनायो। उनीहरूको उत्साह, मौलिक पोसाक र ढोलकको तालले यात्रामा अझै रौनक थपिदियो। स्थानीय स्वादको मीठो खाना खाएर सिरकभित्र छिर्दा निकुञ्जबाट आउने रातको शान्त र अलिअलि डरलाग्दो आवाजले छुट्टै रोमाञ्चकता पैदा गरिरहेको थियो।\n\nदोस्रो दिन: जङ्गल सफारी र प्रकृतिको सामिप्यता\nदोस्रो दिनको बिहानै सूर्योदयसँगै हाम्रो जङ्गल सफारीको टोली तयार भयो। बिहानको सिरसिरे हावा र चराको चिरबिर आवाजबीच हामी जिप सफारीका लागि निकुञ्जभित्र प्रवेश गर्‍यौँ । सालको बाक्लो जङ्गल, अग्ला-अग्ला काँसका घारी र माटोको बास्ना। जङ्गलको बीचमा पुगेपछि पाइलैपिच्छे केही न केही नयाँ देखिने उत्सुकता हुन्थ्यो। केही समयको पर्खाइपछि भाग्यवश हामीले बाटो काट्दै गरेको एकसिङ्गे गैंडा देख्न पायौँ। त्यसका साथै मयूर, जरायो, कालो हरिण र नदी किनारमा घडियाल गोहीहरू नजिकैबाट नियाल्ने अवसर मिल्यो। जङ्गलको त्यो मौनता र वन्यजन्तुको उन्मुक्त विचरणले मनमा एक प्रकारको अद्भूत शान्ति मिल्यो ।\nदिउँसोको खाना खाएपछि बुटवल फर्किने समय भयो । गाडी चढ्दा चितवनको त्यो न्यानोपन, थारू बस्तीको आतिथ्यता र जङ्गलको सामीप्यता भने मनभरि सँगै थियो । छोटो समयको यो \"दुई दिन एक रात\" को बसाइले मनलाई नयाँ ऊर्जा र ताजगी मात्र दिएन, प्रकृतिको नजिक रहेर जीवनलाई नियाल्ने एउटा सुन्दर दृष्टिकोण पनि दियो। चितवनको यो सम्झना मेरो यात्रा-संस्मरणको पानामा सधैँभरि एउटा मीठो र अविस्मरणीय अध्यायका रूपमा रहिरहनेछ ।"}],"slug":"peaceful-rapti-and-sunset-a-chitwan-trip-remain-a-lifetime-memories","tags":["स्मरण","यात्रा","चितवन","राप्ती"],"seoTitle":"शान्त राप्ती र घामको बिदाइ : चितवन यात्राका पानाहरू","seoDesc":"नेपालकै पहिलो राष्ट्रिय निकुञ्ज रहेको चितवनतर्फको यात्रा शुरू हुँदा मनमा एउटा अलग्गै उत्साह थियो । नागबेली सडक र त्रिशूली नदीको किनारै-किनार अघि बढेको गाडी जब तराईको समथर भूभागमा छिर्यो, हावाको स्पर्श नै फेरियो।","ogTitle":"शान्त राप्ती र घामको बिदाइ : चितवन यात्राका पानाहरू","ogDesc":"नेपालकै पहिलो राष्ट्रिय निकुञ्ज रहेको चितवनतर्फको यात्रा शुरू हुँदा मनमा एउटा अलग्गै उत्साह थियो । नागबेली सडक र त्रिशूली नदीको किनारै-किनार अघि बढेको गाडी जब तराईको समथर भूभागमा छिर्यो, हावाको स्पर्श नै फेरियो।"},{"id":"smaran-4","title":"स्मृतिका पानाहरूमा : घान्द्रुक, अस्ट्रेलियन बेस क्याम्प र पोखरा","category":"smaran","type":"article","date":"2026-11-03","cover":"/img/ghandruk-abc-pokhara-on-memory-diaries-cover.jpg","video":"","excerpt":"","featured":false,"yt":false,"blocks":[{"t":"quote","text":"पोखराको आधुनिक जीवनशैली, अस्ट्रेलियन बेस क्याम्पको एकान्त सौन्दर्य र घान्द्रुकको सादगी तथा सांस्कृतिक धनीपनको यो संगम अद्भुत थियो ।","cite":""},{"t":"p","text":"बुटवल — पढाईको व्यस्तता र पट्यारलाग्दो दिनचर्याबाट पर, पहाडका टाकुरा र शान्त तालहरूको काखमा बिताएका ती केही दिनहरू मेरो जीवनका सबैभन्दा अविस्मरणीय क्षण बनेर मनमा कोरिएका छन्। पोखरा, अस्ट्रेलियन बेस क्याम्प र घान्द्रुक—यी तीन ठाउँको यात्रा केवल भौगोलिक दूरी पार गर्नु मात्र थिएन, यो त आत्मिक शान्ति र प्रकृतिको अनुपम सौन्दर्यलाई नजिकबाट महसुस गर्ने एउटा सुन्दर अवसर थियो ।\n\nघान्द्रुक: गुरुङ संस्कृति र ढुङ्गाको गाउँ\n\nअस्ट्रेलियन बेस क्याम्पबाट पोथना र लान्द्रुक हुँदै हाम्रो अन्तिम गन्तव्य थियो—घान्द्रुक। ढुङ्गाले छाएका घरहरू, सफा र घुमाउरो बाटो, अनि गाउँको ठ्याक्कै अगाडि मुस्कुराइरहेको अन्नपूर्ण र माछापुच्छ्रे हिमाल। घान्द्रुक पुग्दा लाग्थ्यो, समय यहीँ रोकिएको छ । त्यहाँको स्थानीय गुरुङ संस्कृति, परम्परागत पहिरनमा फोटो खिचाउने लहर, र स्थानीयवासीको आत्मीय व्यवहारले मनै जित्यो। बिहानै भालेको डाकसँगै उठेर आँगनबाटै हिमालमा परेको बिहानीको पहिलो किरण (गोल्डेन लाइट) हेर्दाको क्षण मेरो मानसपटलमा सधैँ ताजा रहनेछ। घान्द्रुकको स्थानीय स्वाद—कोदाको ढिडो, स्थानीय कुखुराको मासुलगायतको खानाले यात्रामा अझ मिठास थपिदियो ।\n\nअस्ट्रेलियन बेस क्याम्प: हुस्सु, डाँडा र हिमशृङ्खला\n\nपोखराको रमाइलोपछि हाम्रो पाइला काँडे हुँदै अस्ट्रेलियन बेस क्याम्पतर्फ मोडियो। हरियाली जंगल र उकालो बाटो काट्दै अघि बढ्दाको सास्ती बेस क्याम्प पुगेपछि कसैलाई याद रहँदैन। साँझपख अस्ट्रेलियन बेस क्याम्पबाट देखिने सूर्यास्तको दृश्य शब्दमा वर्णन गर्न सकिँदैन। घामका अन्तिम किरणहरू अन्नपूर्ण र धौलागिरि हिमशृङ्खलामा ठोक्किएर सुनौलो रङ्गमा परिणत हुँदा टोलाएर हेरिरहूँ जस्तो लाग्थ्यो। राति खुला आकाशमुनि ताराहरूको तारापुञ्ज हेर्दै चिसो हावामा तातो चियाको घुट्को लिनुको आनन्द बेग्लै थियो ।\n\nतालहरूको सहरमा फेवाको प्रतिविम्ब\n\nहाम्रो यात्राको सुरुवात पोखराबाट भयो। अन्नपूर्ण शृङ्खलाको काखमा सुतिरहेको पोखरा पुग्नेबित्तिकै हावामा अर्कै ताजगी महसुस हुन्थ्यो। फेवातालको किनारमा साँझपख टहलिँदै गर्दा पानीमा परेको माछापुच्छ्रेको प्रतिविम्बले मनै लोभ्याउँथ्यो। तालमा डुङ्गा खियाउँदै तालबाराहीको दर्शन गर्नु र साँझको लेकसाइडमा गुञ्जने सङ्गीतको तालमा हराउनुको अर्कै मज्जा थियो। पोखराले सधैँ एउटा न्यानो आतिथ्य दिन्छ, जसले यात्राको थकानलाई पलभरमै मेटाइदिन्छ ।\n\nअन्त्यमा\nयी दिनहरू कसरी बिते, पत्तै भएन। पोखराको आधुनिक जीवनशैली, अस्ट्रेलियन बेस क्याम्पको एकान्त सौन्दर्य र घान्द्रुकको सादगी तथा सांस्कृतिक धनीपनको यो संगम अद्भुत थियो । सहर फर्किंदा केवल तस्बिरहरू मात्र होइन, प्रकृतिको काखमा बिताएका ती अनगिन्ती सुन्दर सम्झनाहरू र एउटा शान्त मन बोकेर फर्किएका थियौँ। यी स्मृतिहरूले जिन्दगीका हरेक थकानमा सधैँ ऊर्जा थपिरहनेछन् ।"}],"slug":"ghandruk-abc-pokhara-on-memory-diaries","tags":["स्मरण","यात्रा","घान्द्रुक","पोखरा"],"seoTitle":"स्मृतिका पानाहरूमा : घान्द्रुक, अस्ट्रेलियन बेस क्याम्प र पोखरा","seoDesc":"पोखरा, अस्ट्रेलियन बेस क्याम्प र घान्द्रुक—यी तीन ठाउँको यात्रा केवल भौगोलिक दूरी पार गर्नु मात्र थिएन, यो त आत्मिक शान्ति र प्रकृतिको अनुपम सौन्दर्यलाई नजिकबाट महसुस गर्ने एउटा सुन्दर अवसर थियो ।","ogTitle":"स्मृतिका पानाहरूमा : घान्द्रुक, अस्ट्रेलियन बेस क्याम्प र पोखरा","ogDesc":"पोखरा, अस्ट्रेलियन बेस क्याम्प र घान्द्रुक—यी तीन ठाउँको यात्रा केवल भौगोलिक दूरी पार गर्नु मात्र थिएन, यो त आत्मिक शान्ति र प्रकृतिको अनुपम सौन्दर्यलाई नजिकबाट महसुस गर्ने एउटा सुन्दर अवसर थियो ।"},{"id":"samikshya-1","title":"पोखराको सौन्दर्य र जीवनशैली प्रस्तुत गर्ने अनुपम वृत्तचित्र : एक समीक्षात्मक टिप्पणी","category":"samikshya","type":"article","date":"2026-10-28","cover":"/img/pokhara-documentary-review-cover.jpg","video":"","excerpt":"वृत्तचित्रको सुरुआतमै पोखराको नामाकरण र यसको ऐतिहासिक रूपरेखासंगै कास्की राज्यको इतिहासलाई जोड्दै यसले पोखराको सांस्कृतिक जगलाई उजागर गर्छ ।","featured":false,"yt":true,"blocks":[{"t":"p","text":"बुटवल — नेपालको पर्यटकीय राजधानी पोखराको प्राकृतिक, सांस्कृतिक तथा साहसिक आयामलाई समेटेर तयार पारिएको प्रस्तुत वृत्तचित्रले दर्शकलाई एउटा छुट्टै दृश्य-यात्रामा लैजान्छ । ऐतिहासिक पृष्ठभूमिदेखि आधुनिक साहसिक पर्यटनसम्मका पक्षलाई एउटै सूत्रमा बुनेर बनाइएको यो कृतिले पोखरालाई केवल पर्यटकीय थलोका रूपमा मात्र नभई एक जीवन्त अनुभूतिको रूपमा प्रस्तुत गरेको छ । प्रकृतिको काखमा सजिएको यो शहरको कथालाई वृत्तचित्रले कलात्मक र गहिरो भावमा उतारेको छ ।\n \nऐतिहासिक र सांस्कृतिक गहिराइ\n\nवृत्तचित्रको सुरुआतमै पोखराको नामाकरण र यसको ऐतिहासिक रूपरेखालाई सूक्ष्म ढङ्गले प्रस्तुत गरिएको छ । कुनै समय भारत र तिब्बत जोड्ने व्यापारिक मार्गका रूपमा रहेको यो भू-भाग कसरी साना-ठूला पोखरीहरूको पहिचान बोक्दै आजको आधुनिक शहरमा रूपान्तरण भयो भन्ने कथाले वृत्तचित्रलाई ऐतिहासिक गहिराइ दिएको छ । नुन, ऊन र जडीबुटी बोकेका व्यापारीका पाइलादेखि सुरु भएको यो यात्रामा मगर, गुरुङ, ब्राह्मण र क्षेत्रीजस्ता विभिन्न समुदायको सहअस्तित्व र कास्की राज्यको इतिहासलाई जोड्दै यसले पोखराको सांस्कृतिक जगलाई उजागर गर्छ ।\n\nप्राकृतिक सौन्दर्य र तालहरूको चित्रण\n\nप्रकृतिको अनुपम उपहार मानिने अन्नपूर्ण, धौलागिरी र माछापुच्छ्रे हिमश्रृंखलाको दृश्य वर्णन वृत्तचित्रको मुख्य आकर्षण हो । बिहानीको सुनौलो घाम हिमालमा ठोकिँदा देखिने दृश्य र फेवातालको शान्त जलमा पर्ने तिनै हिमालको छायाको चित्रणले दर्शकमा गहिरो प्रभाव पार्छ । फेवातालको किनारमा अवस्थित लेकसाइडको जीवन्तता, साँझको सन्ध्याकालीन आरती, र बेगनास तालको एकान्त वातावरणलाई परस्पर तुलना गर्दै शान्ति र भीडभाड दुवै रूपलाई सन्तुलित ढङ्गले देखाइएको छ ।\n\nधार्मिक, साहसिक र आधुनिक पोखरा\n\nडेभिस फल्स, गुप्तेश्वर महादेव गुफा, बिन्द्याबासिनी मन्दिर, विश्व शान्ति स्तूपा र पुम्दिकोटको विशाल शिव मूर्ति जस्ता धार्मिक तथा पर्यटकीय स्थलहरूको समावेशले यसको बहुआयामिक महत्त्वलाई पुष्टि गर्छ । प्राकृतिक रहस्य र धार्मिक आस्थाको यो संगमले दर्शकलाई आध्यात्मिक शान्ति दिन्छ । साथै, साराङकोटबाट देखिने सूर्योदय, आकाशमा चराझैँ उड्ने प्याराग्लाइडिङ र अल्ट्रा-लाइट फ्लाइट जस्ता साहसिक खेलहरूका माध्यमबाट पोखरालाई \"साहसिक पर्यटनको राजधानी\" का रूपमा स्थापित गर्ने प्रयास सफल देखिन्छ ।\n\nनिष्कर्ष\nआधुनिक पूर्वाधार, व्यवस्थित सडक र आधुनिक होटलहरूको विकास हुँदाहुँदै पनि पोखराले आफ्नो मौलिकता, प्रकृति र आतिथ्यभाव जोगाएर राखेको सन्देश दिँदै वृत्तचित्र अन्त्य हुन्छ । सुन्दर शब्दचयन, तार्किक बहाव र दृश्य-अनुकूल वर्णनका कारण यो वृत्तचित्र पोखरालाई बुझ्न र महसुस गर्न चाहने जोकोहीका लागि एक उत्कृष्ट र सङ्ग्रहणीय सामग्री बनेको छ ।"},{"t":"yt","url":"https://www.youtube.com/embed/Cz0MM62MkV8","caption":"","cover":""}],"slug":"pokhara-documentary-review","tags":["समिक्षा","वृत्तचित्र","पोखरा"],"seoTitle":"पोखराको सौन्दर्य र जीवनशैली प्रस्तुत गर्ने अनुपम वृत्तचित्र : एक समीक्षात्मक टिप्पणी","seoDesc":"नेपालको पर्यटकीय राजधानी पोखराको प्राकृतिक, सांस्कृतिक तथा साहसिक आयामलाई समेटेर तयार पारिएको प्रस्तुत वृत्तचित्रले दर्शकलाई एउटा छुट्टै दृश्य-यात्रामा लैजान्छ ।","ogTitle":"पोखराको सौन्दर्य र जीवनशैली प्रस्तुत गर्ने अनुपम वृत्तचित्र : एक समीक्षात्मक टिप्पणी","ogDesc":"नेपालको पर्यटकीय राजधानी पोखराको प्राकृतिक, सांस्कृतिक तथा साहसिक आयामलाई समेटेर तयार पारिएको प्रस्तुत वृत्तचित्रले दर्शकलाई एउटा छुट्टै दृश्य-यात्रामा लैजान्छ ।"},{"id":"samikshya-2","title":"झरी, चियाको बाफ र जीवनचक्र : एक भावनात्मक वृत्तचित्रको आन्तरिक अवलोकन","category":"samikshya","type":"article","date":"2026-10-27","cover":"/img/jhari-documentary-review-cover.jpg","video":"","excerpt":"दृश्य, आवाज र दर्शनको सुन्दर मिश्रणले गर्दा यो वृत्तचित्रले दर्शकलाई केवल दृश्य रसास्वादन मात्र गराउँदैन, आफ्नो जीवन, उचाइ र खुसीका आयामबारे पुनर्विचार गर्न पनि बाध्य पार्छ ।","featured":false,"yt":true,"blocks":[{"t":"p","text":"बुटवल — झरीको सिमसिमे दृश्यसँगै सुरु हुने तातो चियाको चुस्की, छातामुनि हतारिएका मानिसहरू र पानीका थोपासँग रमाउने बालबालिका। दृश्य सुन्दा कुनै सुन्दर काव्यिक रचना जस्तो लाग्छ, तर यो एउटा यस्तो भावुक वृत्तचित्रको विषयवस्तु हो, जसले प्रकृति र मानव जीवनको गहिरो दर्शनलाई एउटै धागोमा बुनेको छ । २०२६ अप्रिल १९ गते प्रशारण गरिएको यो वृत्तचित्रले सामान्य झरीको परिवेशबाट कथा सुरु गरेर जीवनको अनन्त चक्र, मानव महत्वाकांक्षा र बाल्यकालको निश्छल खुसीलाई कलात्मक रूपमा प्रस्तुत गरेको छ ।\n \nप्रकृति र जीवनको दार्शनिक तुलना\nवृत्तचित्रको मुख्य मर्म मानिसको जीवन र पानीको स्वभाव बीचको समानता हो। पानी जसरी बाफ बनेर उचाइ छुन्छ र फेरि सीमामा पुगेर वर्षा बनी धरतीमा झर्छ, मानिसको जीवन पनि त्यस्तै आरोह-अवरोहले भरिएको हुन्छ ।"},{"t":"list","text":"उचाइको खोजी : चियाको बाफ जस्तै माथि उठ्ने चाहना र महत्वाकांक्षा मानिसको स्वभाव हो ।\n\nयथार्थको धरातल : उडेर सीमा छोएपछि फेरि पानी बनेर धरातलमै झर्नुपर्ने र अरूलाई जीवन दिनुपर्ने प्राकृतिक नियमलाई दृश्य र संवादमार्फत दर्शकसामु राखिएको छ ।\n\nदुःखको मूल कारण : बाफ बन्नु र पानी बनेर झर्नु बीचको यो प्राकृतिक खेललाई बुझ्न नसक्दा नै मानिस दुःखी हुने तथ्यलाई कथाले गहिरोसँग छामेको छ ।","ordered":false},{"t":"quote","text":"जीवनका जटिल दर्शनलाई झरी र चियाको बाफ जस्ता साना प्रसङ्गबाट सम्झाउन सक्नु नै यसको मुख्य सफलता हो ।","cite":""},{"t":"p","text":"बालापन, सामाजिक बन्धन र खुसीको खोजी\nवृत्तचित्रले उमेरको वृद्धिसँगै मानिस कसरी सामाजिक परिधिमा बाँधिन्छ भन्ने विषयलाई निकै मिहीन ढंगले उठाएको छ। मखमली उमेरका साना बालबालिका जसरी झरीमा निर्धक्क रमाउँछन्, वयस्क उमेरका मानिसहरू भने \"छिमेकीले के भन्लान्?\" भन्ने सामाजिक डरका कारण आफ्ना स-साना खुसीहरू दबाउन बाध्य हुन्छन् । साथीसँग एउटै छाता ओढेर अर्कोतर्फ छाता ढल्काउँदै आफू भिज्नुमा पाइने आनन्द र निश्छल प्रेमको प्रसङ्गले दर्शकलाई आफ्नै विगत र बालापनको सम्झना दिलाउँछ। खुसी खोज्न पनि सामाजिक बहाना वा ओत चाहिने आधुनिक मानव जीवनको बाध्यतालाई यसले उजागर गरेको छ ।\n\nअनन्त यात्रा र पुनर्जन्मको सन्देश\nवृत्तचित्रको अन्तिम खण्डले दर्शकलाई एउटा आशावादी र असीम दार्शनिक यात्रामा छाडिदिन्छ। बाफ, पानी, झरी, धरती, महासागर र पुनः बाफ बन्ने यो निरन्तर प्रक्रियालाई जीवनको अनन्त चक्रको रूपमा व्याख्या गरिएको छ । फेरि बालापनमै फर्कने, अबोध बनेर नाच्ने, अनि बाफ बनेर अझ ठूलो उचाइ भेट्दै महासागरसम्मको अनन्त यात्रा गरिरहने चाहनाले वृत्तचित्रलाई केवल दृश्यमा मात्र सीमित नराखी गहिरो वैचारिक उचाइ प्रदान गरेको छ ।\n\nसबल पक्ष र निष्कर्ष\nयो वृत्तचित्रको सबैभन्दा बलियो पक्ष यसको सरल तर गहिरो भावपूर्ण संवाद हो । दृश्य, आवाज र दर्शनको सुन्दर मिश्रणले गर्दा यो वृत्तचित्रले दर्शकलाई केवल दृश्य रसास्वादन मात्र गराउँदैन, आफ्नो जीवन, उचाइ र खुसीका आयामबारे पुनर्विचार गर्न पनि बाध्य पार्छ। जीवनका जटिल दर्शनलाई झरी र चियाको बाफ जस्ता साना प्रसङ्गबाट सम्झाउन सक्नु नै यसको मुख्य सफलता हो ।"},{"t":"yt","url":"https://www.youtube.com/embed/R7fbpUgaw50","caption":"","cover":""}],"slug":"jhari-documentary-review","tags":["समिक्षा","वृत्तचित्र","झरी"],"seoTitle":"झरी, चियाको बाफ र जीवनचक्र : एक भावनात्मक वृत्तचित्रको आन्तरिक अवलोकन","seoDesc":"सामान्य झरीको परिवेशबाट कथा सुरु गरेर जीवनको अनन्त चक्र, मानव महत्वाकांक्षा र बाल्यकालको निश्छल खुसीलाई कलात्मक रूपमा प्रस्तुत गरेको छ ।","ogTitle":"झरी, चियाको बाफ र जीवनचक्र : एक भावनात्मक वृत्तचित्रको आन्तरिक अवलोकन","ogDesc":"सामान्य झरीको परिवेशबाट कथा सुरु गरेर जीवनको अनन्त चक्र, मानव महत्वाकांक्षा र बाल्यकालको निश्छल खुसीलाई कलात्मक रूपमा प्रस्तुत गरेको छ ।"},{"id":"samikshya-3","title":"गोरखपुर – दक्षिण भारत रेलको त्यो सिट : जहाँ एउटा 'जिउँदो पितृ' सँग साक्षात्कार भयो","category":"samikshya","type":"article","date":"2026-10-26","cover":"/img/jiundo-pitri-documentary-review-cover.jpg","video":"","excerpt":"आफ्नो अस्तित्व रहेर पनि मृत तुल्य बनेर बाँच्नुपर्ने बाध्यतालाई यसले अत्यन्तै मार्मिक ढङ्गले प्रस्तुत गरेको छ ।","featured":false,"yt":true,"blocks":[{"t":"p","text":"बुटवल — दोश्रो विश्वयुद्धको कालो छायाले तछारिएका हजारौँ गोर्खाली सैनिक र तिनका परिवारको त्रासदीलाई पर्दामा उतार्ने प्रयासस्वरूप निर्माण गरिएको वृत्तचित्र ‘जिउँदो पितृ’ ले दर्शकको हृदय पगाल्छ । सन् १९६२ को ऐतिहासिक पृष्ठभूमिमा आधारित यो वृत्तचित्रले एउटा वृद्ध भूपू-सैनिकको विछोड, सामाजिक सङ्कट र पहिचानको अवसानलाई मर्मस्पर्शी ढङ्गले प्रस्तुत गरेको छ ।\n\nकथाको सार अनि दृश्य-यात्रा\nगोरखपुरबाट दक्षिण भारततर्फ गुडिरहेको रेलको डिब्बाबाट सुरु हुने वृत्तचित्रको दृश्यले प्रारम्भमै दर्शकलाई कौतूहलको वातावरणमा बाँध्छ। ६५ वर्षका एक वृद्ध झ्याल बाहिर टोलाइरहेका छन्, जसका आँखाबाट अविरल अश्रुधारा बगिरहेको छ। पोखराका एक युवक (वृत्तचित्रका सुत्रधार) ले उनीसँग संवाद गर्ने प्रयास गर्दा वृद्धले आफूलाई 'पितृ' र आफ्नो घर 'स्वर्ग' भएको बताउँछन् ।\n\nकथा बिस्तारै फ्ल्यासब्याकमा मोडिन्छ— गण्डकी प्रदेशको पहाडी गाउँबाट परिवारको जोहो गर्न ब्रिटिश सेनामा भर्ती भएका उनी बर्मा (म्यानमार) को युद्ध मैदान पुग्छन्। जापानी सेनासँगको भीषण लडाइँबाट ज्यान बचाएर भागेका उनी उतै अर्को घरजम गरेर बस्छन्। वर्षौँपछि मातृभूमि र पहिलो परिवारको सम्झनाले डोर्याएर नेपाल फर्कँदै गर्दा, रेलमै भेटिएका एक युवकबाट उनले थाहा पाउँछन्— गाउँमा त उनको काजक्रिया भइसकेछ, श्रीमतीले पेन्सन बुझिरहेकी छिन् र तिनै युवक उनका कान्छा ज्वाइँ बनिसकेका रहेछन् !"},{"t":"quote","text":"रेलको झ्यालबाट देखिने अनन्त क्षितिज र वृद्धको आँसुलाई निर्देशकले जीवन्त रूपमा संयोजन गरेका छन् ।","cite":""},{"t":"p","text":"आफ्नो उपस्थितिले स्थापित भइसकेको परिवारको खुसी नबिग्रियोस् भनेर उनी आफू जीवितै रहेको परिचय लुकाउँछन्। आफूसँग भएको केही रकम ज्वाइँमार्फत श्रीमती र सासुलाई पठाएर उनी स्टेसनको भिडमा बिलिन हुन्छन्। पछि बर्मा सरकारले विदेशीलाई प्रवेशमा रोक लगाएको समाचार पढेपछि उनी सधैँका लागि गन्तव्यहीन, पहिचानहीन र घरबारविहीन हुन पुग्छन् ।\n\nकलात्मक प्रस्तुति र संवेदना\nयो वृतचित्रले युद्धको प्रत्यक्ष असर सीमानामा मात्र होइन, मानिसको व्यक्तिगत जीवन र संवेदनाभित्र कसरी पर्छ भन्ने तथ्यलाई गहिरो गरी खोपेको छ। 'काजक्रिया भइसकेकाले म मरिसकेँ, त्यसैले म पितृ हुँ' भन्ने वृद्धको मर्मस्पर्शी भनाइले दर्शकको छाती चसक्क पार्छ । वृत्तचित्रको सबल पक्ष भनेको यसको सरल तर गहिरो संवाद र दृश्य संयोजन हो। रेलको झ्यालबाट देखिने अनन्त क्षितिज र वृद्धको आँसुलाई निर्देशकले जीवन्त रूपमा संयोजन गरेका छन्। गरिबी, अशिक्षा र वैदेशिक रोजगारीको बाध्यताले नेपालीहरूले पुस्तौँदेखि भोग्दै आएको पीडालाई यसले प्रतिकात्मक रूपमा उजागर गर्छ ।\n\nनिष्कर्ष\n'जिउँदो पितृ' केवल एउटा वृद्धको विगतको कथा मात्र होइन, यो त विश्वयुद्धका कारण उजाडिएका करोडौँ घरपरिवारको सामूहिक क्रन्दन हो । आफ्नो अस्तित्व रहेर पनि मृत तुल्य बनेर बाँच्नुपर्ने बाध्यतालाई यसले अत्यन्तै मार्मिक ढङ्गले प्रस्तुत गरेको छ । इतिहासको पानामा हराएका यस्ता अनगिन्ती 'जिउँदा पितृहरू' को आत्माको शान्तिको कामना गर्दै, पुनः कसैले यस्तो नियति भोग्नुनपरोस् भन्ने सन्देश दिँदै वृत्तचित्र सकिन्छ। यो सामग्री वृत्तचित्र पारखीहरूका लागि एक उत्कृष्ट र आँखा उघार्ने सिर्जना बनेको छ ।"},{"t":"yt","url":"https://www.youtube.com/embed/2R0vfaS1GHk","caption":"","cover":""}],"slug":"jiundo-pitri-documentary-review","tags":["समिक्षा","वृत्तचित्र","जिउँदो पितृ","गोर्खाली सैनिक"],"seoTitle":"गोरखपुर – दक्षिण भारत रेलको त्यो सिट : जहाँ एउटा 'जिउँदो पितृ' सँग साक्षात्कार भयो","seoDesc":"दोश्रो विश्वयुद्धको कालो छायाले तछारिएका हजारौँ गोर्खाली सैनिक र तिनका परिवारको त्रासदीलाई पर्दामा उतार्ने प्रयासस्वरूप निर्माण गरिएको वृत्तचित्र ‘जिउँदो पितृ’ ले दर्शकको हृदय पगाल्छ ।","ogTitle":"गोरखपुर – दक्षिण भारत रेलको त्यो सिट : जहाँ एउटा 'जिउँदो पितृ' सँग साक्षात्कार भयो","ogDesc":"दोश्रो विश्वयुद्धको कालो छायाले तछारिएका हजारौँ गोर्खाली सैनिक र तिनका परिवारको त्रासदीलाई पर्दामा उतार्ने प्रयासस्वरूप निर्माण गरिएको वृत्तचित /* clean URLs: on the live domain posts use /slug/ instead of #slug */
function cleanOn(){var b=siteBase();if(!b)return false;if(location.origin===b)return true;try{var bh=new URL(b).hostname.replace(/^www\./,'');var h=location.hostname;return /^https?:$/.test(location.protocol)&&(h===bh||h.slice(-(bh.length+1))==='.'+bh)}catch(e){return false}}
function hashToPath(h){h=String(h||'').replace(/^#/,'');try{h=decodeURIComponent(h)}catch(e){}
 if(h.indexOf('post-')===0&&postById(h.slice(5))){var pp=postById(h.slice(5));h=pp.slug||pp.id}
 if(!h||h==='home'||h==='cat-video')return '/';
 if(h.indexOf('cat-')===0)return '/'+h.slice(4)+'/';
 if(h==='portfolio'||h==='contact')return '/'+h+'/';
 var pq=postById(h);if(pq&&pq.category)return '/'+pq.category+'/'+encodeURIComponent(pq.slug||pq.id)+'/';
 return '/'+encodeURIComponent(h)+'/'}
function pathToHash(){var p=location.pathname.replace(/^\/+|\/+$/g,'');try{p=decodeURIComponent(p)}catch(e){}
 if(!p||p==='index.html'||p==='404.html')return '';
 var sg=p.split('/');if(sg[0]==='cat'&&sg[1])return 'cat-'+sg[1];
 if(sg.length>1)return sg[sg.length-1];
 if(catOf(sg[0]))return 'cat-'+sg[0];
 return p}
function curHash(){if(cleanOn()){var h=pathToHash();return h||location.hash.replace(/^#/,'')}return location.hash.replace(/^#/,'')}

document.addEventListener('click',function(e){
 if(!cleanOn()||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
 var a=e.target.closest&&e.target.closest('a[data-h]');if(!a||a.getAttribute('target'))return;
 e.preventDefault();history.pushState(null,'',hashToPath(a.getAttribute('data-h')));ctx=null;render()},true);

function buildDoc(extraHead){
 var hs=document.head.querySelector('style');
 var reset=(hs&&hs.id!=='app-css')?hs.textContent:RESET_FALLBACK;
 var css=$('#app-css').textContent,js=$('#app-js').textContent;
 var data=JSON.stringify(state).replace(/</g,'\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
 return '<!doctype html><html lang="'+m0lang()+'"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style>'+(extraHead!=null?extraHead:staticHomeHead())+'</head><body>'+HEAD.replace(/<title>[\s\S]*?<\/title>\n?/,'')+'<style id="app-css">'+css+'</style>\n<div id="app"></div>\n<div id="overlay-root"></div>\n<script type="application/json" id="blog-data">'+data+SC+'\n<script id="app-js">'+js+SC+'</body></html>'}
async function publish(){
 if(!dirty)return;
 if(!artifactApi){state.rev=(state.rev||0)+1;try{localStorage.removeItem(DKEY)}catch(e){}var bl=new Blob([buildDoc()],{type:'text/html'}),au=document.createElement('a');au.href=URL.createObjectURL(bl);au.download='Sandesh_Digital_Journal.html';document.body.appendChild(au);au.click();au.remove();dirty=false;renderAdmin();toast('Updated file downloaded');return}
 var btn=$('.pub');if(btn){btn.disabled=true;btn.textContent='Publishing…'}
 state.rev=(state.rev||0)+1;
 try{localStorage.removeItem(DKEY)}catch(e){}
 try{await artifactApi.publish(buildDoc());toast('Published')}
 catch(e){state.rev--;try{localStorage.setItem(DKEY,JSON.stringify({rev:state.rev||0,state:state}))}catch(_){}
  var c=e&&e.code;toast(c==='conflict'?'Someone published a newer version. Reloading.':c==='not_writer'||c==='not_granted'?'This view cannot publish. Open the page as its owner.':'Could not publish. Your changes are still here, try again.');renderAdmin()}}

/* uploads */
function pickFile(){return new Promise(function(res){var f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=function(){res(f.files&&f.files[0]||null)};f.oncancel=function(){res(null)};f.click()})}
function toDataUri(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(blob)})}
async function shrink(file){
 if(/gif|svg/.test(file.type))return file.size>1500000?null:file;
 try{var bmp=await createImageBitmap(file);var sc=Math.min(1,1600/bmp.width);var cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  var q=.84,b=null;for(var n=0;n<4;n++){b=await new Promise(function(r){cv.toBlob(r,'image/jpeg',q)});if(b&&b.size<700000)break;q-=.15}
  return b}catch(e){return null}}
async function uploadImage(){
 var f=await pickFile();if(!f)return null;toast('Adding image…');
 var b=await shrink(f);if(!b){toast('Could not read that image. Try a JPG, PNG or smaller GIF.');return null}
 try{return await toDataUri(b)}catch(e){toast('Could not read that image.');return null}}

function curBlocks(){return ctx.kind==='post'?ctx.obj.blocks:ctx.obj.blocks}
function savePost(){
 var p=ctx.obj;
 if(!String(p.title||'').trim()){toast('Add a title first.');return}
 if(p.category==='__new'){var nm=String(p.newcat||'').trim();if(!nm){toast('Name the new topic.');return}
  var c={id:'c'+Date.now().toString(36),name:nm};state.categories.push(c);p.category=c.id}
 delete p.newcat;
 p.slug=slugify(p.slug||'');if(!p.slug)p.slug=uniqueSlug(p.title,p.id);else if(slugTaken(p.slug,p.id)){var us=uniqueSlug(p.slug,p.id);toast('That URL was already used. Saved as /'+us+'/');p.slug=us}
 ['seoTitle','seoDesc','ogTitle','ogDesc','canonical'].forEach(function(k){if(p[k]!=null)p[k]=String(p[k]).trim()});
 p.tags=String(p.tagsStr||'').split(/[,#\n]+/).map(function(x){return x.trim()}).filter(function(x,i,a){return x&&a.indexOf(x)===i});delete p.tagsStr;
 p.blocks=p.blocks.filter(function(b){return b.t==='hr'||b.t==='yt'||b.t==='link'||(b.t==='img'?b.src:String(b.text||'').trim())});
 if(p.featured)state.posts.forEach(function(x){x.featured=false});
 var i=state.posts.findIndex(function(x){return x.id===p.id});
 if(i>-1)state.posts[i]=p;else state.posts.push(p);
 ctx=null;closeOv();markDirty();nav(p.slug||p.id);render();toast('Saved. Press Publish to put it live.')}
